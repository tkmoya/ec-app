<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>共通エラー</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../static/css/common.css">
</head>
<body>
<header th:fragment="pageHeader">
    <div class="site-title">
        <a href="/">ECショップ</a></div>
    <div class="mr-16">
        <th:block th:if="${session['userId'] == null}">
            「ゲスト」さん
        </th:block>
        <th:block th:if="${session['userId'] != null}">
            「 [[${session.editFormModel.name}]] 」さん
        </th:block>
    </div>

</header>
<main>
    <form action="error" method="POST">
        <h1>予期せぬエラーが発生しました。管理者にお問い合わせください。</h1>
        <div class="btn-group">
            <button type="button" class="btn btn-primary" id="menu-btn" onClick="location.href='menu'">
                <i class="fas fa-home"></i>
                メニューへ戻る
            </button>
        </div>
    </form>
</main>
<footer th:fragment="pageFooter">
    <p>&copy; 2025 ECショップ All Rights Reserved.</p>
</footer>
<th:block th:insert="~{layout/_Footer :: pageFooter}"></th:block>
</body>
</html>
