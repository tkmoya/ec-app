<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注文完了 | ECサイト</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../static/css/common.css">
</head>
<body>
<th:block th:insert="~{layout/_Header :: pageHeader}"></th:block>
<header th:fragment="pageHeader">
    <div class="site-title">
        <a href="/">ECショップ</a></div>
    <div class="mr-16">
        <th:block th:if="${session['userId'] == null}">
            「ゲスト」さん
        </th:block>
        <th:block th:if="${session['userId'] != null}">
            「 [[${session.editFormModel.name}]] 」さん
        </th:block>
    </div>
</header>
<main>
    <div class="container">
        <h1 class="page-title">
            <i class="fas fa-check-circle"></i>
            注文完了
        </h1>
        <div class="inner-container text-center complete-container">
            <div class="icon-container green">
                <i class="fas fa-check-circle complete-icon"></i>
            </div>

            <h2 class="complete-message">ご注文ありがとうございます</h2>

            <p class="mb-2">
                ご注文が正常に完了しました。<br>
                商品の発送準備が整い次第、メールにてお知らせいたします。
            </p>

            <div class="generated-number">
                注文番号: <span th:text="${orderNumber}">OD-20250415-12345</span>
            </div>

            <div class="btn-group">
                <button type="button" class="btn btn-primary" id="menu-btn" onClick="location.href='menu'">
                    <i class="fas fa-home"></i>
                    メニューへ戻る
                </button>
            </div>
        </div>
    </div>
</main>
<footer th:fragment="pageFooter">
    <p>&copy; 2025 ECショップ All Rights Reserved.</p>
</footer>
<th:block th:insert="~{layout/_Footer :: pageFooter}"></th:block>
</body>
</html>
