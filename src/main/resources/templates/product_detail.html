<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品詳細 | ECサイト</title>
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<th:block th:insert="~{layout/_Header :: pageHeader}"></th:block>

<main>
    <div class="container con-w">
        <h1 class="page-title">
            <i class="fas fa-check-circle"></i>
            商品詳細
        </h1>
        <div class="inner-container">
            <div class="flex">
                <div class="product-image">
                    <img src="9687.png" th:src="@{/img/simple.png}" th:alt="${code.productName}">
                </div>
                <div class="product-info">
                    <h1 class="product-name">[[${code.productName}]]</h1>

                    <div class="product-description">
                        [[${code.memo}]]
                    </div>

                    <div class="product-price">[[${code.unitPrice}]]</div>

                    <form action="product_detail" method="POST" id="searchForm">
                        <div class="product-quantity">
                            <label for="quantity" class="quantity-label">購入数</label>
                            <input type="text" th:name="${code.productCode}" class="quantity-input" id="quantity">
                        </div>

                        <div class="btn-group flex-start">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-shopping-cart"></i>
                                カートに入れる
                            </button>

                            <button type="button" class="btn btn-light" onclick="history.back()">
                                <i class="fas fa-arrow-left"></i>
                                戻る
                            </button>
                        </div>

                        <input type="hidden" name="detailCode" th:value="${code.productCode}">
                        <span id="choiseErrMesse" class="error-message">[[${error}]]</span>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:insert="~{layout/_Footer :: pageFooter}"></th:block>
</body>
</html>
