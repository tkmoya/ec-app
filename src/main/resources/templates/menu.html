<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メニュー | ECサイト</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
</head>
<body>
<th:block th:insert="~{layout/_Header :: pageHeader}"></th:block>

<main>
    <div class="container">
        <div class="menu-container">
            <th:block th:if="${session['userId'] == null}">
                <a href="register_user" class="menu-item">
                    <div class="menu-icon">
                        <i class="fas fa-user-plus"></i>
                    </div>
                    <div class="menu-title">新規会員登録</div>
                </a>
            </th:block>

            <a href="edit" class="menu-item">
                <div class="menu-icon">
                    <i class="fas fa-user-edit"></i>
                </div>
                <div class="menu-title">会員情報変更</div>
            </a>

            <a href="order_start" class="menu-item">
                <div class="menu-icon">
                    <i class="fas fa-search"></i>
                </div>
                <div class="menu-title">商品検索</div>
            </a>

            <a href="cart_list" class="menu-item menu-cart">
                <div class="menu-icon">
                    <i class="fas fa-shopping-cart"></i>
                </div>
                <div class="menu-title">カート</div>
            </a>
        </div>

        <div class="auth-buttons">
            <th:block th:if="${session['userId'] != null}">
                <input type="button" name="logout" value="ログアウト" onclick="location.href='logout'"
                       class="auth-button logout-button">
            </th:block>
            <th:block th:if="${session['userId'] == null}">
                <input type="button" name="login" value="ログイン" onclick="location.href='login'"
                       class="auth-button login-button">
            </th:block>
        </div>
    </div>
</main>

<th:block th:insert="~{layout/_Footer :: pageFooter}"></th:block>
</body>
</html>
