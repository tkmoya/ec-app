<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会員情報編集 | ECサイト</title>
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<th:block th:insert="~{layout/_Header :: pageHeader}"></th:block>

<main>
    <div class="container">
        <h1 class="page-title">
            <i class="fas fa-user-edit"></i>
            会員情報編集
        </h1>

        <div class="inner-container">
            <form action="edit_check" method="POST" th:object="${editFormModel}">
                <div class="form-section">
                    <h2 class="section-title">会員情報</h2>

                    <input type="hidden" name="password" th:value="*{password}"/>
                    <input type="hidden" name="registerDate" th:value="*{registerDate}"/>


                    <div class="form-group">
                        <label for="memno" class="form-label">会員No</label>
                        <input type="text" id="memno" class="form-control id-control" th:value="*{memberNo}" readonly>
                        <input type="hidden" th:value="*{memberNo}" name="memberNo"/>
                        <span class="error-message" th:errors="*{memberNo}"></span>
                    </div>

                    <div class="form-group">
                        <label for="name" class="form-label required">氏名</label>
                        <input type="text" name="name" th:field="*{name}" id="name" class="form-control"
                               placeholder="例：山田 太郎" required>
                        <span class="error-message" th:errors="*{name}"></span>
                    </div>

                    <div class="form-group">
                        <label for="newpass" class="form-label">パスワード</label>
                        <input type="password" name="newPassword" id="newpass" class="form-control"
                               placeholder="変更する場合のみ入力してください">
                        <div class="password-toggle">
                            <input type="checkbox" id="show-password">
                            <label for="show-password" class="password-toggle-label">パスワードを表示</label>
                        </div>
                        <small class="form-text">8文字以上の英字と数字を組み合わせてください</small>
                        <span class="error-message" th:errors="*{newPassword}"></span>
                    </div>

                    <div class="form-group">
                        <label for="passchk" class="form-label">パスワード（確認用）</label>
                        <input type="password" name="confNewPassword" id="passchk" class="form-control"
                               placeholder="変更する場合のみ入力してください">
                        <span class="error-message" th:errors="*{confNewPassword}"></span>
                    </div>

                    <div class="form-group">
                        <label for="age" class="form-label">年齢</label>
                        <input type="number" name="age" th:field="*{age}" id="age" class="form-control age-control"
                               min="0"
                               max="120" placeholder="例：30">
                        <span class="error-message" th:errors="*{age}"></span>
                    </div>

                    <div class="form-group">
                        <label for="sex" class="form-label">性別</label>
                        <select name="sex" id="sex" class="gender-control">
                            <option value="m" th:selected="*{sex == 'm'}">男性</option>
                            <option value="f" th:selected="*{sex == 'f'}">女性</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="zip" class="form-label">郵便番号</label>
                        <div class="input-group">
                            <input type="text" name="zip" th:field="*{zip}" id="zip" class="form-control zip-control"
                                   placeholder="例：123-4567" maxlength="8">
                        </div>
                        <small class="form-text">ハイフン(-)ありでも、なしでも入力できます</small>
                        <span class="error-message" th:errors="*{zip}"></span>
                    </div>

                    <div class="form-group">
                        <label for="address" class="form-label">住所</label>
                        <textarea name="address" id="address" class="form-control" rows="3" th:field="*{address}"
                                  placeholder="例：東京都渋谷区渋谷1-1-1 渋谷マンション101"></textarea>
                        <span class="error-message" th:errors="*{address}"></span>
                    </div>

                    <div class="form-group">
                        <label for="tel" class="form-label required">電話番号</label>
                        <input type="text" name="tel" th:field="*{tel}" id="tel" class="form-control tel-control"
                               placeholder="例：03-1234-5678" required>
                        <small class="form-text">ハイフン(-)ありでも、なしでも入力できます</small>
                        <span class="error-message" th:errors="*{tel}"></span>
                    </div>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-check"></i>
                        確認
                    </button>
                    <button type="button" class="btn btn-light" onclick="location.href='menu'">
                        <i class="fas fa-arrow-left"></i>
                        戻る
                    </button>
                    <button type="button" class="btn btn-light" onClick="clearFormAll();">
                        <i class="fas fa-eraser"></i>
                        クリア
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<th:block th:insert="~{layout/_Footer :: pageFooter}"></th:block>

<script>
    // パスワード表示切替
    document.getElementById('show-password').addEventListener('change', function () {
        const passwordField = document.getElementById('newpass');
        const confirmField = document.getElementById('passchk');

        if (this.checked) {
            passwordField.type = 'text';
            confirmField.type = 'text';
        } else {
            passwordField.type = 'password';
            confirmField.type = 'password';
        }
    });

    // 郵便番号による住所検索（デモ用）
    document.getElementById('zip-search').addEventListener('click', function () {
        const zipcode = document.getElementById('zip').value.replace('-', '');

        // デモとして、特定の郵便番号の場合のみ住所を自動入力
        if (zipcode === '1234567') {
            document.getElementById('address').value = '東京都渋谷区渋谷1-1-1';
            alert('住所が見つかりました');
        } else {
            alert('該当する住所が見つかりませんでした');
        }
    });

    // フォームクリア
    function clearFormAll() {
        const form = document.querySelector('form');
        const inputs = form.querySelectorAll('input:not([type="hidden"]), textarea, select');

        inputs.forEach(input => {
            if (input.type === 'checkbox') {
                input.checked = false;
            } else if (input.type === 'select-one') {
                input.selectedIndex = 0;
            } else {
                input.value = '';
            }
        });
    }
</script>
</body>
</html>
